<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nút Gửi Tin Nhắn - CSS Transition</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="card">
    <h1>Demo Nút "Gửi tin nhắn"</h1>
    <p>Rê chuột để thấy hiệu ứng nâng lên và click để cảm nhận phản hồi bấm</p>

    <button class="send-btn">
      <span class="btn-text">Gửi tin nhắn</span>
      <!-- Icon máy bay giấy gửi tin nhắn -->
      <svg class="send-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="22" y1="2" x2="11" y2="13"></line>
        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
      </svg>
    </button>
  </div>
</body>
</html>
